spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.kafkasddpoc.order.OrderCreated
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.kafkasddpoc.order

# --- Producer reliability (task 1.2, decision D1) ---
# These values used to be implicit Kafka client defaults; they are explicit so they can be read,
# explained and tested. Local-friendly timeouts make a Kafka outage fail fast instead of ~2 min.
# acks=all: the leader waits for all in-sync replicas (with one broker, only the leader).
spring.kafka.producer.acks=all
# Idempotence: the broker drops duplicates caused by producer retries (requires acks=all).
spring.kafka.producer.properties.enable.idempotence=true
# Retries are effectively unlimited; delivery.timeout.ms is what really bounds the total time.
spring.kafka.producer.retries=2147483647
# Upper bound from send() to final success/failure, retries included.
# Kafka requires delivery.timeout.ms >= request.timeout.ms + linger.ms (3000 + 0 <= 5000).
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
# Max time send() may block waiting for metadata/buffer (e.g. broker unreachable).
spring.kafka.producer.properties.max.block.ms=2000
# HTTP-side wait for Kafka's confirmation, just above delivery.timeout.ms (see OrderService).
app.orders.publication-timeout=6s
# --- Payment failure simulation (task 2.2, decision D2) ---
# Orders whose customerId equals this value make PaymentConsumer fail on purpose (used later to
# demonstrate consumer retries and the DLT). Empty = no simulated failure.
app.payment.fail-customer-id=CUST-FAIL
